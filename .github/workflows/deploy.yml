# Build in CI, deploy to VPS. Server only pulls the image + rolls the container.
#
# Trigger: push a `v*` tag (e.g. `git tag v1.0.0 && git push --tags`).
# Registry: Docker Hub, shared repo faishalrachman/ipat-app, tag `sakem-landing`.
# Secrets/vars live in the `production` environment of this repo.

name: Build & Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: docker.io/faishalrachman/ipat-app:sakem-landing

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-sakem-landing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Build & push image
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          echo "$DOCKERHUB_TOKEN" | docker login -u faishalrachman --password-stdin
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Migrations run from the runner against the DB's public endpoint (the
      # DATABASE_URL_CI secret) — drizzle-kit is a devDependency and isn't in the
      # runtime image, so it can't run inside the container on the server.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run db:migrate

      - name: Deploy to VPS
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ vars.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_DIR: /opt/app/sakola-kembara-landing
          # .env.local written on the server. It is OVERWRITTEN on every deploy,
          # so a hand edit on the VPS is lost: set values in the `production`
          # environment of this repo (Settings > Environments), never on the
          # server. A variable or secret that is not set there renders as an
          # empty `KEY=` line: fine for the optional ones (lib/env.ts treats an
          # empty value as unset), fatal for NEXTAUTH_URL, DATABASE_URL and
          # AUTH_SECRET. Add a line here for every variable the app reads.
          # App reaches Postgres over the internal ipat-bridge network at
          # postgres_16:5432.
          ENV_FILE_CONTENT: |
            NODE_ENV=production
            NEXTAUTH_URL=${{ vars.NEXTAUTH_URL }}
            AUTH_URL=${{ vars.AUTH_URL }}
            AUTH_TRUST_HOST=true
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            AUTH_GOOGLE_ID=${{ vars.AUTH_GOOGLE_ID }}
            AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
            SSO_JWT_SECRET=${{ secrets.SSO_JWT_SECRET }}
            SSO_COOKIE_DOMAIN=${{ vars.SSO_COOKIE_DOMAIN }}
            SSO_ALLOWED_ORIGINS=${{ vars.SSO_ALLOWED_ORIGINS }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            EMAIL_FROM=${{ vars.EMAIL_FROM }}
            APP_URL=${{ vars.APP_URL }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            PORT=3000
        run: bash .github/scripts/deploy.sh
